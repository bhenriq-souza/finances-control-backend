name: deploy

# Publica a imagem no Artifact Registry e atualiza a tag no repositório GitOps,
# de onde o Argo CD reconcilia. Toda a lógica vive no workflow reutilizável do
# homelab-gitops — este arquivo só o chama com os parâmetros desta aplicação.

on:
    push:
        # develop publica em dev; main, que só recebe develop pelo merge do
        # responsável, publica em prd (ADR-0011 do hub).
        branches: [develop, main]
        # Mudanças que não entram na imagem não precisam gerar deploy. O contrato
        # (docs/openapi.yaml) é copiado para a imagem e servido em runtime, então
        # volta a valer depois da exclusão de docs/**: o GitHub avalia os padrões
        # em ordem e não aceita negação em paths-ignore.
        paths:
            - '**'
            - '!**.md'
            - '!docs/**'
            - '!specs/**'
            - '!.claude/**'
            - 'docs/openapi.yaml'
    # O ambiente sai da branch, também no disparo manual: develop nunca chega a prd.
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        uses: bhenriq-souza/homelab-gitops/.github/workflows/docker-build-push.yaml@main
        with:
            app-name: finances-backend
            environment: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
        secrets:
            GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
            GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
            GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}

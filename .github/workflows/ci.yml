name: ci

# O CI apenas invoca o orquestrador único de gates (spec 0002, INV-0002-03).
# Nunca adicione aqui um comando de verificação que não esteja em scripts/check.mjs.

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop]

jobs:
    check:
        runs-on: ubuntu-latest

        # O gate `test` inclui as suítes de integração da spec 0003, que exigem um
        # PostgreSQL real. A porta 5433 é a mesma do docker-compose.test.yml, para
        # que a URL de teste seja uma só, local e no CI.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: finances_test
                    POSTGRES_DB: finances_test
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U finances_test -d finances_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # --require-tools converte SKIP em falha: no CI, um gate ausente é
            # um pipeline incompleto, não um pipeline verde (INV-0002-05).
            - name: Quality gates
              run: npm run check -- --require-tools

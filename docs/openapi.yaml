openapi: 3.0.3

info:
    title: Finances Control API
    description: |
        API de controle financeiro pessoal.
        Requisitos e decisões de arquitetura: https://github.com/bhenriq-souza/finances-control
    version: 0.0.0

servers:
    - url: http://localhost:3000
      description: Local
    - url: http://finances.dev.homelab.local
      description: Dev (cluster K3s homelab)

tags:
    - name: Platform
      description: Endpoints de infraestrutura
    - name: Identity
      description: Usuários, autenticação e concessão de perfil
    - name: Accounts
      description: Bancos, contas bancárias e cartões de crédito
    - name: Earnings
      description: Receitas
    - name: Expenses
      description: Despesas e tipos de despesa
    - name: Statements
      description: Faturas de cartão, pagamentos de fatura e estornos

paths:
    /health:
        get:
            tags: [Platform]
            summary: Liveness da aplicação
            description: |
                Responde se o processo está de pé. Não verifica dependências —
                checagens de banco pertencem a um endpoint de readiness separado.
            operationId: getHealth
            responses:
                '200':
                    description: Aplicação no ar
                    headers:
                        x-correlation-id:
                            $ref: '#/components/headers/CorrelationId'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/HealthReport'
                            example:
                                data:
                                    status: ok
                                    application: finances-control-backend
                                    version: 0.0.0
                                    environment: dev
                                    uptimeSeconds: 42

    /health/ready:
        get:
            tags: [Platform]
            summary: Readiness da aplicação
            description: |
                Verifica as dependências externas — hoje, a conexão com o PostgreSQL,
                por `SELECT 1` com teto de 2 segundos e sem cache entre requisições.
                Responde 503 enquanto alguma delas estiver fora, para tirar o pod do
                balanceamento sem que o kubelet o reinicie.
            operationId: getReadiness
            responses:
                '200':
                    description: Aplicação pronta para receber tráfego
                    headers:
                        x-correlation-id:
                            $ref: '#/components/headers/CorrelationId'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ReadinessReport'
                            example:
                                data:
                                    status: ready
                                    checks:
                                        database: up
                '503':
                    description: Alguma dependência está indisponível
                    headers:
                        x-correlation-id:
                            $ref: '#/components/headers/CorrelationId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    message: Service not ready
                                    code: NOT_READY
                                    details:
                                        checks:
                                            database: down

    /users/me:
        get:
            tags: [Identity]
            summary: O próprio usuário
            description: |
                Única rota que responde a quem ainda não tem perfil — é por ela que o
                cliente descobre que a conta está aguardando aprovação de um Admin.
                O registro local é criado aqui, no primeiro acesso autenticado.
            operationId: getCurrentUser
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/User'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '503':
                    $ref: '#/components/responses/AuthUnavailable'

    /users:
        get:
            tags: [Identity]
            summary: Lista os usuários
            description: Exige perfil `ADMIN`. Ordenados por data de criação.
            operationId: listUsers
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Usuários da plataforma
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/UserResponse'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /users/{id}/profile:
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
                  format: uuid
        patch:
            tags: [Identity]
            summary: Concede ou troca o perfil de um usuário
            description: |
                Exige perfil `ADMIN`. O perfil passa a valer na requisição seguinte do
                alvo, sem troca de token — ele é lido do banco a cada chamada.
                Ninguém altera o próprio perfil, e a operação que deixaria a plataforma
                sem nenhum `ADMIN` é recusada.
            operationId: grantUserProfile
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [profile]
                            properties:
                                profile:
                                    type: string
                                    enum: [ADMIN, BILLER, VIEWER]
            responses:
                '200':
                    $ref: '#/components/responses/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/UserNotFound'
                '409':
                    $ref: '#/components/responses/ProfileConflict'
        delete:
            tags: [Identity]
            summary: Revoga o perfil de um usuário
            description: |
                Exige perfil `ADMIN`. Devolve o usuário ao estado pendente, sem acesso a
                recurso de domínio algum. Mesmas travas do `PATCH`.
            operationId: revokeUserProfile
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/User'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/UserNotFound'
                '409':
                    $ref: '#/components/responses/ProfileConflict'

    /banks:
        get:
            tags: [Accounts]
            summary: Lista os bancos
            operationId: listBanks
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/IncludeArchived'
            responses:
                '200':
                    description: Bancos cadastrados, ordenados por nome
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/BankResponse'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Accounts]
            summary: Cadastra um banco
            description: Exige perfil `ADMIN`.
            operationId: createBank
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [febrabanCode, name]
                            properties:
                                febrabanCode:
                                    type: string
                                    pattern: '^[0-9]{3}$'
                                    description: Código FEBRABAN, três dígitos com zeros à esquerda.
                                name:
                                    type: string
            responses:
                '201':
                    $ref: '#/components/responses/Bank'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/AccountsConflict'

    /banks/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        patch:
            tags: [Accounts]
            summary: Altera um banco
            description: |
                Exige perfil `ADMIN`. Só o nome é alterável: trocar o código FEBRABAN
                faria do registro outro banco, e as contas e cartões ligados a ele
                continuariam apontando para o antigo.
            operationId: updateBank
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name]
                            properties:
                                name:
                                    type: string
            responses:
                '200':
                    $ref: '#/components/responses/Bank'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'

    /banks/{id}/archive:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        post:
            tags: [Accounts]
            summary: Arquiva um banco
            description: |
                Exige perfil `ADMIN`. Registro financeiro não se apaga: arquivar o tira
                da listagem padrão e o mantém sustentando o histórico. A operação é
                idempotente. Um banco arquivado não recebe conta nem cartão novo.
            operationId: archiveBank
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/Bank'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
        delete:
            tags: [Accounts]
            summary: Desarquiva um banco
            operationId: unarchiveBank
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/Bank'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'

    /bank-accounts:
        get:
            tags: [Accounts]
            summary: Lista as contas bancárias
            operationId: listBankAccounts
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/IncludeArchived'
            responses:
                '200':
                    description: Contas cadastradas, ordenadas por descrição
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/BankAccountResponse'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Accounts]
            summary: Cadastra uma conta bancária
            description: |
                Exige perfil `ADMIN`. O saldo corrente nasce igual ao de abertura e **não
                é informável**: daí em diante, só lançamento o move.
            operationId: createBankAccount
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateBankAccount'
            responses:
                '201':
                    $ref: '#/components/responses/BankAccount'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
                '409':
                    $ref: '#/components/responses/AccountsConflict'

    /bank-accounts/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Accounts]
            summary: Consulta uma conta bancária
            operationId: getBankAccount
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/BankAccount'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
        patch:
            tags: [Accounts]
            summary: Altera uma conta bancária
            description: |
                Exige perfil `ADMIN`. `currentBalanceCents`, `openingBalanceCents` e
                `bankId` não são aceitos: o primeiro só muda por lançamento, o segundo é
                imutável, e trocar a conta de banco é cadastrar outra conta.
            operationId: updateBankAccount
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                type:
                                    $ref: '#/components/schemas/BankAccountType'
                                accountNumber:
                                    type: string
                                description:
                                    type: string
                                overdraftLimitCents:
                                    type: integer
                                    minimum: 0
            responses:
                '200':
                    $ref: '#/components/responses/BankAccount'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
                '409':
                    $ref: '#/components/responses/AccountsConflict'

    /bank-accounts/{id}/archive:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        post:
            tags: [Accounts]
            summary: Arquiva uma conta bancária
            operationId: archiveBankAccount
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/BankAccount'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
        delete:
            tags: [Accounts]
            summary: Desarquiva uma conta bancária
            operationId: unarchiveBankAccount
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/BankAccount'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'

    /bank-transfers:
        get:
            tags: [Accounts]
            summary: Lista as transferências entre contas
            description: Em ordem de `occurredOn` e depois de criação. Qualquer perfil lê.
            operationId: listBankTransfers
            security: [{ bearerAuth: [] }]
            parameters:
                - name: bankAccountId
                  in: query
                  required: false
                  description: Transferências que saem **ou** entram na conta.
                  schema: { type: string, format: uuid }
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/BankTransferStatus'
                - name: from
                  in: query
                  required: false
                  description: '`occurredOn` mínimo, inclusivo. Maior que `to` é 400.'
                  schema: { type: string, format: date }
                - name: to
                  in: query
                  required: false
                  description: '`occurredOn` máximo, inclusivo.'
                  schema: { type: string, format: date }
            responses:
                '200':
                    description: Transferências que casam com os filtros
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/BankTransferResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Accounts]
            summary: Registra uma transferência entre contas
            description: |
                Exige perfil `ADMIN` ou `BILLER`. `status` default `COMPLETED`: move o
                saldo das duas contas na mesma transação e publica `TransferCompleted`.
                `SCHEDULED` não move saldo. Saldo negativo é aceito.
            operationId: createBankTransfer
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateBankTransfer'
            responses:
                '201':
                    $ref: '#/components/responses/BankTransfer'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/BankTransferNotFound'
                '409':
                    $ref: '#/components/responses/BankTransferConflict'

    /bank-transfers/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Accounts]
            summary: Consulta uma transferência
            operationId: getBankTransfer
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/BankTransfer'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/BankTransferNotFound'
        patch:
            tags: [Accounts]
            summary: Altera uma transferência
            description: |
                Exige perfil `ADMIN` ou `BILLER`. `description` e `notes` sempre; contas,
                valor e data só em `SCHEDULED` (a concluída é desfeita antes). `status` e
                `completedOn` são 400.
            operationId: updateBankTransfer
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateBankTransfer'
            responses:
                '200':
                    $ref: '#/components/responses/BankTransfer'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/BankTransferNotFound'
                '409':
                    $ref: '#/components/responses/BankTransferConflict'
        delete:
            tags: [Accounts]
            summary: Exclui uma transferência agendada
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Só `SCHEDULED`: a concluída é desfeita
                antes, para que os saldos voltem explicitamente.
            operationId: deleteBankTransfer
            security: [{ bearerAuth: [] }]
            responses:
                '204':
                    description: Excluída
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/BankTransferNotFound'
                '409':
                    $ref: '#/components/responses/BankTransferConflict'

    /bank-transfers/{id}/status:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        patch:
            tags: [Accounts]
            summary: Conclui ou desfaz uma transferência
            description: |
                Exige perfil `ADMIN` ou `BILLER`. `SCHEDULED → COMPLETED` conclui e move as
                duas contas (publica `TransferCompleted`); `COMPLETED → SCHEDULED` desfaz e
                devolve os saldos. Repetir o status atual é 409. Conta arquivada é aceita aqui.
            operationId: changeBankTransferStatus
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeBankTransferStatus'
            responses:
                '200':
                    $ref: '#/components/responses/BankTransfer'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/BankTransferNotFound'
                '409':
                    $ref: '#/components/responses/BankTransferConflict'

    /credit-cards:
        get:
            tags: [Accounts]
            summary: Lista os cartões de crédito
            operationId: listCreditCards
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/IncludeArchived'
            responses:
                '200':
                    description: Cartões cadastrados, ordenados por nome
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/CreditCardResponse'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Accounts]
            summary: Cadastra um cartão de crédito
            description: |
                Exige perfil `ADMIN`. O limite disponível nasce igual ao total e não é
                informável. O cartão já responde com o ciclo de fatura corrente — não
                existe cartão cadastrado e não operante.
            operationId: createCreditCard
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCreditCard'
            responses:
                '201':
                    $ref: '#/components/responses/CreditCard'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
                '409':
                    $ref: '#/components/responses/AccountsConflict'

    /credit-cards/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Accounts]
            summary: Consulta um cartão de crédito
            operationId: getCreditCard
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/CreditCard'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
        patch:
            tags: [Accounts]
            summary: Altera um cartão de crédito
            description: |
                Exige perfil `ADMIN`. Alterar `creditLimitCents` move o limite disponível
                na mesma medida, preservando o quanto já foi gasto; o disponível pode
                ficar negativo se o novo limite for menor que o uso atual. Alterar os dias
                do ciclo vale para ciclos ainda não fechados.
            operationId: updateCreditCard
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                creditLimitCents:
                                    type: integer
                                    exclusiveMinimum: 0
                                closingDay:
                                    type: integer
                                    minimum: 1
                                    maximum: 31
                                dueDay:
                                    type: integer
                                    minimum: 1
                                    maximum: 31
            responses:
                '200':
                    $ref: '#/components/responses/CreditCard'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
                '409':
                    $ref: '#/components/responses/AccountsConflict'

    /credit-cards/{id}/archive:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        post:
            tags: [Accounts]
            summary: Arquiva um cartão de crédito
            operationId: archiveCreditCard
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/CreditCard'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'
        delete:
            tags: [Accounts]
            summary: Desarquiva um cartão de crédito
            operationId: unarchiveCreditCard
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/CreditCard'
                '404':
                    $ref: '#/components/responses/AccountsNotFound'

    /earnings:
        get:
            tags: [Earnings]
            summary: Lista as receitas
            description: |
                Em ordem de `occurredOn` e depois de criação. Filtros opcionais, combinados por
                E. Qualquer perfil lê.
            operationId: listEarnings
            security: [{ bearerAuth: [] }]
            parameters:
                - name: from
                  in: query
                  required: false
                  description: '`occurredOn` mínimo, inclusivo. Maior que `to` é 400.'
                  schema: { type: string, format: date }
                - name: to
                  in: query
                  required: false
                  description: '`occurredOn` máximo, inclusivo.'
                  schema: { type: string, format: date }
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/EarningStatus'
                - name: kind
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/EarningKind'
                - name: earningTypeId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: bankAccountId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: installmentGroupId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
            responses:
                '200':
                    description: Receitas que casam com os filtros
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/EarningResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Earnings]
            summary: Lança uma receita
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Criar nunca move o saldo da conta; `status`
                default `OPEN`. Devolve uma lista com uma receita (`FIXED`/`VARIABLE`) ou com
                `installmentTotal` parcelas, em ordem (`INSTALLMENT`), todas na mesma transação,
                e publica um `EarningCreated` por receita.
            operationId: createEarning
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateEarning'
            responses:
                '201':
                    description: As receitas criadas
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/EarningResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EarningNotFound'
                '409':
                    $ref: '#/components/responses/EarningConflict'

    /earnings/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Earnings]
            summary: Consulta uma receita
            operationId: getEarning
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/Earning'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EarningNotFound'
        patch:
            tags: [Earnings]
            summary: Altera uma receita
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Aceita `description`, `earningTypeId`,
                `occurredOn`, `amountCents`, `bankAccountId` e `notes`; ao menos um campo.
                `amountCents` e `bankAccountId` de receita recebida são 409. Trocar conta ou
                valor de receita não recebida não move saldo. Em parcela, `bankAccountId` vale para
                todas as parcelas não recebidas do grupo; os demais campos, só para ela. `kind`, `status`, `receivedOn` e
                `installment*` são 400 citando o campo (o status muda por `PATCH …/status`).
            operationId: updateEarning
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateEarning'
            responses:
                '200':
                    $ref: '#/components/responses/Earning'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EarningNotFound'
                '409':
                    $ref: '#/components/responses/EarningConflict'
        delete:
            tags: [Earnings]
            summary: Exclui uma receita não recebida
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Só receita não recebida: a recebida é
                desfeita antes, para que o saldo volte explicitamente. Não move saldo. Excluir uma
                parcela exclui também as não recebidas do grupo; as recebidas ficam.
            operationId: deleteEarning
            security: [{ bearerAuth: [] }]
            responses:
                '204':
                    description: Excluída
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EarningNotFound'
                '409':
                    $ref: '#/components/responses/EarningConflict'

    /earnings/{id}/status:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        patch:
            tags: [Earnings]
            summary: Muda o status de uma receita
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Receber soma `amountCents` ao saldo da conta
                na mesma transação (publica `EarningReceived`); `RECEIVED → OPEN` devolve o
                saldo. `FORECAST` e `OVERDUE` não são alvo válido.
            operationId: changeEarningStatus
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeEarningStatus'
            responses:
                '200':
                    $ref: '#/components/responses/Earning'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EarningNotFound'
                '409':
                    $ref: '#/components/responses/EarningConflict'

    /expenses:
        get:
            tags: [Expenses]
            summary: Lista as despesas
            description: |
                Filtros opcionais, combinados por E. Sem filtro, devolve tudo. Em ordem de
                `occurredOn` e depois de criação. Qualquer perfil lê.
            operationId: listExpenses
            security: [{ bearerAuth: [] }]
            parameters:
                - name: from
                  in: query
                  required: false
                  description: '`occurredOn` mínimo, inclusivo. Maior que `to` é 400.'
                  schema: { type: string, format: date }
                - name: to
                  in: query
                  required: false
                  description: '`occurredOn` máximo, inclusivo.'
                  schema: { type: string, format: date }
                - name: status
                  in: query
                  required: false
                  schema: { $ref: '#/components/schemas/ExpenseStatus' }
                - name: kind
                  in: query
                  required: false
                  schema: { $ref: '#/components/schemas/ExpenseKind' }
                - name: expenseTypeId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: bankAccountId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: creditCardId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: installmentGroupId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
            responses:
                '200':
                    description: Despesas que casam com os filtros
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ExpenseResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Expenses]
            summary: Lança uma despesa
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Devolve uma lista com um elemento
                (`VARIABLE`) ou com `installmentTotal` parcelas, em ordem de parcela
                (`INSTALLMENT`), todas criadas na mesma transação; publica um `ExpenseCreated`
                por linha. `FIXED` cria a série (spec 0017): a primeira ocorrência com o `status`
                informado e as dos meses seguintes como `FORECAST`, até o último dia do 12º mês
                depois do mês de hoje (ou até `recurrenceEndsOn`), em ordem de data. Despesa de cartão `OPEN` ou `VERIFYING` abate o limite disponível na
                mesma transação (num parcelamento, o total de uma vez); `FORECAST` não. Saldo e
                limite nunca barram o lançamento.
            operationId: createExpense
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateExpense'
            responses:
                '201':
                    description: As despesas criadas, em ordem de parcela
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ExpenseResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ExpenseNotFound'
                '409':
                    $ref: '#/components/responses/ExpenseConflict'

    /expenses/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Expenses]
            summary: Consulta uma despesa
            operationId: getExpense
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/Expense'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ExpenseNotFound'
        patch:
            tags: [Expenses]
            summary: Altera uma despesa
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Corpo estrito e não vazio: `kind`, `status`,
                `paidOn`, `bankAccountId`, `creditCardId` e `installment*` são 400 citando o
                campo. `amountCents` de despesa paga é 409; em cartão abatido do limite, move
                a diferença na mesma transação. Numa parcela, altera só aquela parcela.
            operationId: updateExpense
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateExpense'
            responses:
                '200':
                    $ref: '#/components/responses/Expense'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ExpenseNotFound'
                '409':
                    $ref: '#/components/responses/ExpenseConflict'
        delete:
            tags: [Expenses]
            summary: Exclui uma despesa
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Só despesa não paga; a paga é 409 (desfaça o
                pagamento antes). Despesa de cartão devolve o limite. Excluir uma parcela exclui,
                na mesma transação, todas as parcelas não pagas do grupo; as pagas permanecem.
            operationId: deleteExpense
            security: [{ bearerAuth: [] }]
            responses:
                '204':
                    description: Excluída
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ExpenseNotFound'
                '409':
                    $ref: '#/components/responses/ExpenseConflict'

    /expenses/{id}/status:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        patch:
            tags: [Expenses]
            summary: Muda o status de uma despesa
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Pagar despesa de conta abate o saldo e grava
                `paidOn` (default: hoje, no fuso de negócio); desfazer devolve. Despesa de
                cartão não é paga por aqui. `FORECAST → OPEN` de cartão abate o limite.
            operationId: changeExpenseStatus
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeExpenseStatus'
            responses:
                '200':
                    $ref: '#/components/responses/Expense'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ExpenseNotFound'
                '409':
                    $ref: '#/components/responses/ExpenseConflict'

    /expenses/{id}/payment-method:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        patch:
            tags: [Expenses]
            summary: Troca a forma de pagamento de uma despesa
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Move uma despesa não paga para outra conta
                ou outro cartão; o corpo leva exatamente um entre `bankAccountId` e
                `creditCardId` (`postedOn` só com `creditCardId`). Despesa paga é 409
                `EXPENSE_ALREADY_PAID`; destino arquivado é 409 `BANK_ACCOUNT_ARCHIVED` ou
                `CREDIT_CARD_ARCHIVED`; destino igual à origem responde 200 sem efeito.
                Numa parcela, vale para todas as parcelas do grupo que não estão pagas nem
                em fatura fechada; a resposta é sempre a lista das despesas movidas, em
                ordem de parcela. Tudo na mesma transação: sair de um cartão devolve o
                limite, entrar abate (`OPEN`, `VERIFYING`; `FORECAST` não move limite) e
                `OVERDUE` de conta chega ao cartão como `OPEN`. Entrando num cartão,
                `postedOn` é o informado (aplicado à despesa indicada; as demais parcelas
                usam o default) ou `max(occurredOn, último dia fechado + 1)`; saindo para
                uma conta, volta a nulo. Despesa de cartão em fatura fechada, ou `postedOn`
                informado dentro da janela fechada do destino, é 409 `STATEMENT_CLOSED`.
                Saldo de conta nunca se move.
            operationId: changeExpensePaymentMethod
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            description: Exatamente um entre `bankAccountId` e `creditCardId`.
                            properties:
                                bankAccountId: { type: string, format: uuid }
                                creditCardId: { type: string, format: uuid }
                                postedOn:
                                    type: string
                                    format: date
                                    description: Só com `creditCardId`; não anterior a `occurredOn`.
                            oneOf:
                                - required: [bankAccountId]
                                - required: [creditCardId]
            responses:
                '200':
                    description: As despesas movidas, em ordem de parcela
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ExpenseResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ExpenseNotFound'
                '409':
                    description: |
                        `EXPENSE_ALREADY_PAID`, `BANK_ACCOUNT_ARCHIVED`, `CREDIT_CARD_ARCHIVED`
                        ou `STATEMENT_CLOSED` (mensagem com o último dia fechado).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /statements:
        get:
            tags: [Statements]
            summary: Lista as faturas de um cartão
            description: |
                Faturas do cartão com `closesOn` entre `from` e `to`, fechadas e projetadas, em
                ordem de `closesOn`. `creditCardId` é obrigatório. Sem `from` e `to`, devolve as
                fechadas dos últimos doze meses e a aberta corrente. A janela cobre no máximo
                120 faturas (400 `VALIDATION_ERROR` acima disso) e `from` maior que `to` é 400.
                A fatura projetada (aberta) tem `id` e `closedAt` nulos e `status` `OPEN`.
                A listagem não traz `expenses`, `refunds` nem `payments`. Qualquer perfil lê.
                Registra antes qualquer fechamento vencido do cartão.
            operationId: listStatements
            security: [{ bearerAuth: [] }]
            parameters:
                - name: creditCardId
                  in: query
                  required: true
                  schema: { type: string, format: uuid }
                - name: from
                  in: query
                  required: false
                  description: '`closesOn` mínimo, inclusivo.'
                  schema: { type: string, format: date }
                - name: to
                  in: query
                  required: false
                  description: '`closesOn` máximo, inclusivo.'
                  schema: { type: string, format: date }
            responses:
                '200':
                    description: As faturas do cartão, em ordem de `closesOn`
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/StatementResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'

    /statements/current:
        get:
            tags: [Statements]
            summary: Consulta a fatura aberta de hoje
            description: |
                Fatura aberta do cartão (projetada), com o detalhe: `expenses`, `refunds` e
                `payments` (estes últimos, os pagamentos antecipados). `creditCardId` é
                obrigatório. Qualquer perfil lê.
            operationId: getCurrentStatement
            security: [{ bearerAuth: [] }]
            parameters:
                - name: creditCardId
                  in: query
                  required: true
                  schema: { type: string, format: uuid }
            responses:
                '200':
                    $ref: '#/components/responses/Statement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'

    /statements/current/payments:
        post:
            tags: [Statements]
            summary: Paga antecipadamente a fatura aberta
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Debita a conta e libera o limite do cartão
                na mesma transação; o pagamento fica sem fatura (`statementId` nulo no evento)
                até o fechamento e nenhuma despesa é marcada como paga. `amountCents` vai de 1
                ao `remainingCents` atual da fatura aberta (409
                `STATEMENT_PAYMENT_EXCEEDS_REMAINING`). Com fatura `CLOSED` pendente no cartão é
                409 `STATEMENT_PREVIOUS_UNPAID`. `paidOn` é opcional (default hoje), entre o
                início da fatura aberta e hoje (400). Conta arquivada é 409
                `BANK_ACCOUNT_ARCHIVED`; saldo insuficiente não barra. Devolve a fatura aberta
                com o detalhe.
            operationId: payCurrentStatement
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateEarlyStatementPayment'
            responses:
                '201':
                    $ref: '#/components/responses/Statement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'
                '409':
                    $ref: '#/components/responses/StatementConflict'

    /statements/current/payments/{paymentId}:
        parameters:
            - $ref: '#/components/parameters/StatementPaymentId'
        delete:
            tags: [Statements]
            summary: Desfaz um pagamento antecipado
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Desfaz o **último** pagamento antecipado do
                cartão (`creditCardId` na query, obrigatório) enquanto a fatura não fecha: a
                conta recebe o valor de volta e o limite é consumido, na mesma transação. Outro
                que não o último é 409 `STATEMENT_PAYMENT_LOCKED`. Depois do fechamento, o
                pagamento pertence à fatura registrada e segue a regra dela. Não publica evento.
            operationId: undoCurrentStatementPayment
            security: [{ bearerAuth: [] }]
            parameters:
                - name: creditCardId
                  in: query
                  required: true
                  schema: { type: string, format: uuid }
            responses:
                '204':
                    description: Desfeito
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'
                '409':
                    $ref: '#/components/responses/StatementConflict'

    /statements/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Statements]
            summary: Consulta uma fatura fechada
            description: |
                Fatura persistida (`CLOSED`, `PAID` ou `ROLLED_OVER`), com o detalhe:
                `expenses` e `refunds` da janela, em ordem de `postedOn`, e `payments`. A
                fatura projetada não tem `id` e só se lê por `GET /statements` e
                `GET /statements/current`. Qualquer perfil lê.
            operationId: getStatement
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/Statement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'
        patch:
            tags: [Statements]
            summary: Informa o pagamento mínimo da fatura
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Grava o mínimo informado pelo cliente, sem
                restrição quanto ao valor: só o formato de dinheiro (inteiro de centavos, não
                negativo) é validado, e `null` o apaga. Vale para qualquer fatura persistida.
                O sistema não calcula mínimo; o informado só serve à resposta e ao cálculo de
                `overdue`. Devolve a fatura com o detalhe.
            operationId: updateStatement
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateStatement'
            responses:
                '200':
                    $ref: '#/components/responses/Statement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'

    /statements/{id}/payments:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        post:
            tags: [Statements]
            summary: Paga uma fatura fechada
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Total, mínimo ou valor livre: para o backend,
                um `amountCents` entre 1 e `remainingCents`. Uma fatura aceita vários
                pagamentos. Na mesma transação, debita a conta, libera o limite do cartão e
                publica `StatementPaymentRegistered`; se o restante chegou a zero, a fatura
                passa a `PAID`, as despesas da cadeia em `OPEN` ou `VERIFYING` passam a `PAID`
                com o `paidOn` do pagamento e `StatementPaid` é publicado. `paidOn` é opcional
                (default hoje), posterior ao `closesOn` e não posterior a hoje (400).
                Erros 409: `STATEMENT_ALREADY_PAID`, `STATEMENT_ROLLED_OVER` (o restante está na
                fatura seguinte), `STATEMENT_PAYMENT_EXCEEDS_REMAINING` (mensagem com o
                restante) e `BANK_ACCOUNT_ARCHIVED`. Saldo insuficiente não barra. Devolve a
                fatura com o detalhe.
            operationId: payStatement
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateStatementPayment'
            responses:
                '201':
                    $ref: '#/components/responses/Statement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'
                '409':
                    $ref: '#/components/responses/StatementConflict'

    /statements/{id}/payments/{paymentId}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
            - $ref: '#/components/parameters/StatementPaymentId'
        delete:
            tags: [Statements]
            summary: Desfaz o último pagamento de uma fatura
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Só o **último** pagamento da fatura, e só
                enquanto a fatura seguinte não foi registrada; fora disso é 409
                `STATEMENT_PAYMENT_LOCKED`. Na mesma transação: a fatura `PAID` volta a `CLOSED`
                e as despesas da cadeia voltam a `OPEN` com `paidOn` nulo, a conta recebe o
                valor de volta, o limite é consumido e o pagamento é apagado. Não publica evento.
            operationId: undoStatementPayment
            security: [{ bearerAuth: [] }]
            responses:
                '204':
                    description: Desfeito
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/StatementNotFound'
                '409':
                    $ref: '#/components/responses/StatementConflict'

    /credit-card-refunds:
        get:
            tags: [Statements]
            summary: Lista os estornos de cartão
            description: |
                Filtros opcionais, combinados por E; `from` e `to` incidem sobre `postedOn`,
                inclusivos (`from` maior que `to` é 400). Em ordem de `postedOn`. Qualquer
                perfil lê.
            operationId: listCreditCardRefunds
            security: [{ bearerAuth: [] }]
            parameters:
                - name: creditCardId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: expenseId
                  in: query
                  required: false
                  schema: { type: string, format: uuid }
                - name: from
                  in: query
                  required: false
                  description: '`postedOn` mínimo, inclusivo.'
                  schema: { type: string, format: date }
                - name: to
                  in: query
                  required: false
                  description: '`postedOn` máximo, inclusivo.'
                  schema: { type: string, format: date }
            responses:
                '200':
                    description: Estornos que casam com os filtros
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/CreditCardRefundResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
        post:
            tags: [Statements]
            summary: Lança um estorno de cartão
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Devolve `amountCents` ao limite disponível na
                mesma transação, abate o total da fatura em que cai (a do `postedOn`) e publica
                `CreditCardRefundRegistered`. Sem `postedOn`, o default é
                `max(occurredOn, último dia fechado + 1)`; o informado não pode cair na janela
                fechada (409 `STATEMENT_CLOSED`) nem ser anterior a `occurredOn` (400).
                `expenseId`, opcional, aponta a compra estornada e precisa ser despesa do mesmo
                cartão (409 `REFUND_EXPENSE_MISMATCH`); a soma dos estornos da despesa não passa
                do valor dela (409 `REFUND_EXCEEDS_EXPENSE`). Cartão arquivado aceita estorno.
            operationId: createCreditCardRefund
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCreditCardRefund'
            responses:
                '201':
                    $ref: '#/components/responses/CreditCardRefund'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/CreditCardRefundNotFound'
                '409':
                    $ref: '#/components/responses/CreditCardRefundConflict'

    /credit-card-refunds/{id}:
        parameters:
            - $ref: '#/components/parameters/ResourceId'
        get:
            tags: [Statements]
            summary: Consulta um estorno de cartão
            operationId: getCreditCardRefund
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    $ref: '#/components/responses/CreditCardRefund'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/CreditCardRefundNotFound'
        patch:
            tags: [Statements]
            summary: Altera a descrição ou as observações de um estorno
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Corpo estrito e não vazio: só `description` e
                `notes`; qualquer outro campo é 400 citando o campo. Para corrigir valor ou
                data, exclui-se e lança-se de novo, se a janela estiver aberta.
            operationId: updateCreditCardRefund
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCreditCardRefund'
            responses:
                '200':
                    $ref: '#/components/responses/CreditCardRefund'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/CreditCardRefundNotFound'
        delete:
            tags: [Statements]
            summary: Exclui um estorno de cartão
            description: |
                Exige perfil `ADMIN` ou `BILLER`. Consome de novo o valor do limite disponível,
                na mesma transação. Estorno em janela fechada é 409 `STATEMENT_CLOSED`
                (mensagem com o último dia fechado).
            operationId: deleteCreditCardRefund
            security: [{ bearerAuth: [] }]
            responses:
                '204':
                    description: Excluído
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/CreditCardRefundNotFound'
                '409':
                    $ref: '#/components/responses/CreditCardRefundConflict'

components:
    parameters:
        ResourceId:
            name: id
            in: path
            required: true
            schema:
                type: string
                format: uuid
        StatementPaymentId:
            name: paymentId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        IncludeArchived:
            name: archived
            in: query
            required: false
            description: '`true` inclui os arquivados na listagem; o padrão os esconde.'
            schema:
                type: string
                enum: ['true', 'false']

    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: ID token do Firebase, obtido pelo cliente e enviado em toda chamada.

    responses:
        User:
            description: O usuário
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/UserResponse'
        Unauthenticated:
            description: |
                Sem token válido. `UNAUTHENTICATED` para header ausente ou credencial
                inválida; `TOKEN_EXPIRED` quando basta renovar o token.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        AuthUnavailable:
            description: |
                `AUTH_UNAVAILABLE` — o provedor de identidade está fora do ar. Não é
                credencial inválida: o cliente deve tentar de novo mais tarde.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Forbidden:
            description: |
                `PROFILE_PENDING` quando a conta ainda não tem perfil, e `FORBIDDEN`
                quando o perfil não alcança a operação.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        UserNotFound:
            description: '`USER_NOT_FOUND`'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        ProfileConflict:
            description: |
                `CANNOT_CHANGE_OWN_PROFILE` ao mirar o próprio usuário, e `LAST_ADMIN`
                quando a operação deixaria a plataforma sem administrador.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Bank:
            description: O banco
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/BankResponse'
        BankAccount:
            description: A conta bancária
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/BankAccountResponse'
        CreditCard:
            description: O cartão de crédito
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/CreditCardResponse'
        AccountsNotFound:
            description: '`BANK_NOT_FOUND`, `BANK_ACCOUNT_NOT_FOUND` ou `CREDIT_CARD_NOT_FOUND`'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        AccountsConflict:
            description: |
                `BANK_ALREADY_EXISTS`, `BANK_ACCOUNT_ALREADY_EXISTS` e
                `CREDIT_CARD_ALREADY_EXISTS` para duplicidade; `BANK_ARCHIVED` ao tentar
                vincular a um banco arquivado.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        BankTransfer:
            description: A transferência
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/BankTransferResponse'
        BankTransferNotFound:
            description: '`BANK_TRANSFER_NOT_FOUND` ou `BANK_ACCOUNT_NOT_FOUND`'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        BankTransferConflict:
            description: |
                `BANK_ACCOUNT_ARCHIVED` ao criar ou alterar com conta arquivada;
                `BANK_TRANSFER_ALREADY_COMPLETED` ao alterar contas, valor ou data, ou
                excluir, transferência concluída; `BANK_TRANSFER_STATUS_UNCHANGED` ao
                repetir o status atual.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Earning:
            description: A receita
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/EarningResponse'
        EarningNotFound:
            description: '`EARNING_NOT_FOUND`, `EARNING_TYPE_NOT_FOUND` ou `BANK_ACCOUNT_NOT_FOUND`'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        EarningConflict:
            description: |
                `BANK_ACCOUNT_ARCHIVED` ou `EARNING_TYPE_ARCHIVED` ao lançar ou trocar para
                conta ou tipo arquivado; `EARNING_ALREADY_RECEIVED` ao alterar valor ou conta,
                ou excluir, receita recebida; `EARNING_STATUS_TRANSITION_NOT_ALLOWED` em
                transição fora da tabela.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Expense:
            description: A despesa
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/ExpenseResponse'
        ExpenseNotFound:
            description: |
                `EXPENSE_NOT_FOUND`, `EXPENSE_TYPE_NOT_FOUND`, `BANK_ACCOUNT_NOT_FOUND` ou
                `CREDIT_CARD_NOT_FOUND`
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        ExpenseConflict:
            description: |
                `EXPENSE_ALREADY_PAID` ao alterar o valor ou excluir despesa paga;
                `EXPENSE_STATUS_TRANSITION_NOT_ALLOWED`; `CREDIT_CARD_EXPENSE_PAID_BY_STATEMENT`
                ao pagar ou despagar despesa de cartão; `EXPENSE_TYPE_ARCHIVED`,
                `BANK_ACCOUNT_ARCHIVED` ou `CREDIT_CARD_ARCHIVED` ao lançar ou alterar com
                tipo, conta ou cartão arquivado.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Statement:
            description: A fatura, com o detalhe (`expenses`, `refunds` e `payments`)
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/StatementResponse'
        StatementNotFound:
            description: |
                `STATEMENT_NOT_FOUND`, `STATEMENT_PAYMENT_NOT_FOUND`, `BANK_ACCOUNT_NOT_FOUND`
                ou `CREDIT_CARD_NOT_FOUND`
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        StatementConflict:
            description: |
                `STATEMENT_ALREADY_PAID` e `STATEMENT_ROLLED_OVER` ao pagar fatura quitada ou
                rolada; `STATEMENT_PAYMENT_EXCEEDS_REMAINING` ao pagar acima do restante
                (mensagem com o restante); `STATEMENT_PREVIOUS_UNPAID` no pagamento antecipado
                com fatura fechada pendente (mensagem com o id dela); `STATEMENT_PAYMENT_LOCKED`
                ao desfazer pagamento que não é o último ou depois de a fatura seguinte ser
                registrada; `BANK_ACCOUNT_ARCHIVED` ao pagar com conta arquivada.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        CreditCardRefund:
            description: O estorno de cartão
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data:
                                $ref: '#/components/schemas/CreditCardRefundResponse'
        CreditCardRefundNotFound:
            description: |
                `CREDIT_CARD_REFUND_NOT_FOUND`, `CREDIT_CARD_NOT_FOUND` ou `EXPENSE_NOT_FOUND`
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        CreditCardRefundConflict:
            description: |
                `STATEMENT_CLOSED` ao lançar com `postedOn` em janela fechada ou excluir estorno
                de janela fechada (mensagem com o último dia fechado); `REFUND_EXPENSE_MISMATCH`
                para despesa de conta ou de outro cartão; `REFUND_EXCEEDS_EXPENSE` quando os
                estornos da despesa passariam do valor dela (mensagem com o valor ainda
                estornável).
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        ValidationError:
            description: '`VALIDATION_ERROR`'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'

    headers:
        CorrelationId:
            description: Identificador de correlação, ecoado do request ou gerado
            schema:
                type: string
                format: uuid

    schemas:
        HealthReport:
            type: object
            required: [status, application, version, environment, uptimeSeconds]
            properties:
                status:
                    type: string
                    enum: [ok]
                application:
                    type: string
                version:
                    type: string
                environment:
                    type: string
                uptimeSeconds:
                    type: integer
                    minimum: 0

        ReadinessReport:
            type: object
            required: [status, checks]
            properties:
                status:
                    type: string
                    enum: [ready, not-ready]
                checks:
                    type: object
                    required: [database]
                    properties:
                        database:
                            type: string
                            enum: [up, down]

        UserResponse:
            type: object
            required: [id, email, name, profile, profileGrantedAt, createdAt]
            properties:
                id:
                    type: string
                    format: uuid
                email:
                    type: string
                    format: email
                name:
                    type: string
                profile:
                    type: string
                    nullable: true
                    enum: [ADMIN, BILLER, VIEWER]
                    description: Nulo enquanto um Admin não conceder perfil.
                profileGrantedAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time

        BankAccountType:
            type: string
            enum: [CHECKING, SAVINGS, INVESTMENT]

        BankResponse:
            type: object
            required: [id, febrabanCode, name, archivedAt, createdAt]
            properties:
                id: { type: string, format: uuid }
                febrabanCode: { type: string, pattern: '^[0-9]{3}$' }
                name: { type: string }
                archivedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }

        CreateBankAccount:
            type: object
            required: [bankId, type, accountNumber, description, openingBalanceCents]
            properties:
                bankId: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/BankAccountType' }
                accountNumber: { type: string }
                description: { type: string }
                openingBalanceCents:
                    type: integer
                    description: Inteiro de centavos; pode ser negativo. Fração de centavo é 400.
                overdraftLimitCents:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Cheque especial. O saldo pode ficar negativo.

        BankAccountResponse:
            type: object
            required:
                [
                    id,
                    bank,
                    type,
                    accountNumber,
                    description,
                    openingBalanceCents,
                    currentBalanceCents,
                    overdraftLimitCents,
                    archivedAt,
                    createdAt,
                ]
            properties:
                id: { type: string, format: uuid }
                bank: { $ref: '#/components/schemas/BankResponse' }
                type: { $ref: '#/components/schemas/BankAccountType' }
                accountNumber: { type: string }
                description: { type: string }
                openingBalanceCents:
                    type: integer
                    description: Imutável — é de onde o saldo derivado parte.
                currentBalanceCents:
                    type: integer
                    description: Só muda por lançamento, na mesma transação.
                overdraftLimitCents: { type: integer, minimum: 0 }
                archivedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }

        BankTransferStatus:
            type: string
            enum: [SCHEDULED, COMPLETED]
            description: |
                `COMPLETED` é a transferência que aconteceu (move as duas contas); `SCHEDULED`
                é a que vai acontecer (não move saldo).

        CreateBankTransfer:
            type: object
            required: [fromBankAccountId, toBankAccountId, amountCents, occurredOn, description]
            properties:
                fromBankAccountId: { type: string, format: uuid }
                toBankAccountId:
                    type: string
                    format: uuid
                    description: Diferente da origem.
                amountCents:
                    type: integer
                    minimum: 1
                occurredOn: { type: string, format: date }
                status:
                    $ref: '#/components/schemas/BankTransferStatus'
                completedOn:
                    type: string
                    format: date
                    description: Só com `COMPLETED`; o default é `occurredOn`.
                description: { type: string }
                notes: { type: string }

        UpdateBankTransfer:
            type: object
            description: |
                `fromBankAccountId`, `toBankAccountId`, `amountCents` e `occurredOn` só em
                transferência `SCHEDULED`. `status` e `completedOn` não são aceitos: vão por
                `PATCH /bank-transfers/{id}/status`.
            properties:
                fromBankAccountId: { type: string, format: uuid }
                toBankAccountId: { type: string, format: uuid }
                amountCents: { type: integer, minimum: 1 }
                occurredOn: { type: string, format: date }
                description: { type: string }
                notes: { type: string, nullable: true }

        ChangeBankTransferStatus:
            type: object
            required: [status]
            properties:
                status:
                    $ref: '#/components/schemas/BankTransferStatus'
                completedOn:
                    type: string
                    format: date
                    description: Só ao concluir; o default é hoje.

        BankTransferResponse:
            type: object
            required:
                [
                    id,
                    fromBankAccountId,
                    toBankAccountId,
                    amountCents,
                    occurredOn,
                    status,
                    completedOn,
                    description,
                    notes,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id: { type: string, format: uuid }
                fromBankAccountId: { type: string, format: uuid }
                toBankAccountId: { type: string, format: uuid }
                amountCents: { type: integer }
                occurredOn: { type: string, format: date }
                status: { $ref: '#/components/schemas/BankTransferStatus' }
                completedOn: { type: string, format: date, nullable: true }
                description: { type: string }
                notes: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        CreateCreditCard:
            type: object
            required: [bankId, name, creditLimitCents, closingDay, dueDay]
            properties:
                bankId: { type: string, format: uuid }
                name: { type: string }
                creditLimitCents: { type: integer, exclusiveMinimum: 0 }
                closingDay: { type: integer, minimum: 1, maximum: 31 }
                dueDay: { type: integer, minimum: 1, maximum: 31 }

        BillingCycle:
            type: object
            required: [startsOn, closesOn, dueOn]
            description: |
                Derivado do cartão a cada resposta, nunca persistido. Dia que não existe no
                mês resolve para o último; vencimento no mesmo dia do fechamento, ou antes,
                cai no mês seguinte.
            properties:
                startsOn: { type: string, format: date }
                closesOn: { type: string, format: date }
                dueOn: { type: string, format: date }

        CreditCardResponse:
            type: object
            required:
                [
                    id,
                    bank,
                    name,
                    creditLimitCents,
                    availableLimitCents,
                    closingDay,
                    dueDay,
                    currentCycle,
                    archivedAt,
                    createdAt,
                ]
            properties:
                id: { type: string, format: uuid }
                bank: { $ref: '#/components/schemas/BankResponse' }
                name: { type: string }
                creditLimitCents: { type: integer, exclusiveMinimum: 0 }
                availableLimitCents:
                    type: integer
                    description: |
                        Não informável. Muda por lançamento ou por alteração do limite total,
                        que o move na mesma medida. Pode ser negativo.
                closingDay: { type: integer, minimum: 1, maximum: 31 }
                dueDay: { type: integer, minimum: 1, maximum: 31 }
                currentCycle: { $ref: '#/components/schemas/BillingCycle' }
                archivedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }

        EarningStatus:
            type: string
            enum: [OPEN, FORECAST, RECEIVED, OVERDUE, VERIFYING]

        EarningKind:
            type: string
            enum: [FIXED, VARIABLE, INSTALLMENT]

        EarningTypeResponse:
            type: object
            required: [id, name, archivedAt, createdAt]
            properties:
                id: { type: string, format: uuid }
                name: { type: string }
                archivedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }

        CreateEarning:
            type: object
            required: [description, earningTypeId, kind, amountCents, occurredOn, bankAccountId]
            properties:
                description: { type: string, minLength: 1, maxLength: 200 }
                earningTypeId: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/EarningKind' }
                amountCents: { type: integer, exclusiveMinimum: 0 }
                occurredOn: { type: string, format: date }
                bankAccountId: { type: string, format: uuid }
                status:
                    type: string
                    enum: [OPEN, FORECAST, VERIFYING]
                    description: Default `OPEN`.
                installmentTotal:
                    type: integer
                    minimum: 2
                    maximum: 120
                    description: |
                        Obrigatório em `INSTALLMENT` e proibido nos demais (400). `amountCents`
                        é o **total**: vira `installmentTotal` parcelas mensais rateadas por
                        `splitCents` (resto na primeira), a partir de `occurredOn`, com o dia
                        original preservado (31/01, 28/02, 31/03).
                notes: { type: string, minLength: 1, maxLength: 1000 }

        UpdateEarning:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
                description: { type: string, minLength: 1, maxLength: 200 }
                earningTypeId: { type: string, format: uuid }
                occurredOn: { type: string, format: date }
                amountCents: { type: integer, exclusiveMinimum: 0 }
                bankAccountId: { type: string, format: uuid }
                notes: { type: string, minLength: 1, maxLength: 1000, nullable: true }

        ChangeEarningStatus:
            type: object
            required: [status]
            properties:
                status: { $ref: '#/components/schemas/EarningStatus' }
                receivedOn:
                    type: string
                    format: date
                    description: Só ao receber; o default é hoje.

        EarningResponse:
            type: object
            required:
                [
                    id,
                    description,
                    kind,
                    status,
                    amountCents,
                    occurredOn,
                    receivedOn,
                    notes,
                    earningType,
                    bankAccountId,
                    installment,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id: { type: string, format: uuid }
                description: { type: string }
                kind: { $ref: '#/components/schemas/EarningKind' }
                status: { $ref: '#/components/schemas/EarningStatus' }
                amountCents: { type: integer }
                occurredOn: { type: string, format: date }
                receivedOn: { type: string, format: date, nullable: true }
                notes: { type: string, nullable: true }
                earningType: { $ref: '#/components/schemas/EarningTypeResponse' }
                bankAccountId: { type: string, format: uuid }
                installment:
                    type: object
                    nullable: true
                    required: [groupId, number, total]
                    properties:
                        groupId: { type: string, format: uuid }
                        number: { type: integer }
                        total: { type: integer }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        ExpenseKind:
            type: string
            enum: [FIXED, VARIABLE, INSTALLMENT]
        ExpenseStatus:
            type: string
            enum: [OPEN, FORECAST, PAID, OVERDUE, VERIFYING]

        ExpenseTypeResponse:
            type: object
            required: [id, name, archivedAt, createdAt]
            properties:
                id: { type: string, format: uuid }
                name: { type: string }
                archivedAt: { type: string, format: date-time, nullable: true }
                createdAt: { type: string, format: date-time }

        CreateExpense:
            type: object
            required: [description, expenseTypeId, kind, amountCents, occurredOn]
            description: Exatamente um entre `bankAccountId` e `creditCardId`.
            properties:
                description: { type: string }
                expenseTypeId: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/ExpenseKind' }
                amountCents: { type: integer, minimum: 1 }
                occurredOn: { type: string, format: date }
                bankAccountId: { type: string, format: uuid }
                creditCardId: { type: string, format: uuid }
                postedOn:
                    type: string
                    format: date
                    description: Só com `creditCardId`; não anterior a `occurredOn`.
                status:
                    type: string
                    enum: [OPEN, FORECAST, VERIFYING]
                    default: OPEN
                installmentTotal:
                    type: integer
                    minimum: 2
                    maximum: 120
                    description: |
                        Obrigatório em `INSTALLMENT` e proibido nos demais (400). `amountCents`
                        é o **total**: vira `installmentTotal` parcelas mensais rateadas por
                        `splitCents` (resto na primeira), a partir de `occurredOn`, com o dia
                        original preservado (31/01, 28/02, 31/03). No cartão, `postedOn` da
                        parcela `k` é o da primeira mais `k − 1` meses.
                notes: { type: string }
                recurrenceEndsOn:
                    type: string
                    format: date
                    description: |
                        Só em `FIXED` (400 nos demais); não anterior a `occurredOn`. Última data
                        da série; sem ele a série não tem fim.

        UpdateExpense:
            type: object
            minProperties: 1
            description: |
                `postedOn` só em despesa de cartão. Outros campos são 400: trocar conta ou
                cartão é `PATCH …/payment-method`, mudar status é `PATCH …/status`.
            properties:
                description: { type: string }
                expenseTypeId: { type: string, format: uuid }
                occurredOn: { type: string, format: date }
                amountCents:
                    type: integer
                    minimum: 1
                    description: Recusado (409) em despesa paga.
                postedOn: { type: string, format: date }
                notes: { type: string, nullable: true }

        ChangeExpenseStatus:
            type: object
            required: [status]
            properties:
                status: { $ref: '#/components/schemas/ExpenseStatus' }
                paidOn:
                    type: string
                    format: date
                    description: Só ao pagar; o default é hoje.

        ExpenseResponse:
            type: object
            required:
                [
                    id,
                    description,
                    kind,
                    status,
                    amountCents,
                    occurredOn,
                    paidOn,
                    notes,
                    expenseType,
                    bankAccountId,
                    creditCardId,
                    postedOn,
                    installment,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id: { type: string, format: uuid }
                description: { type: string }
                kind: { $ref: '#/components/schemas/ExpenseKind' }
                status: { $ref: '#/components/schemas/ExpenseStatus' }
                amountCents: { type: integer }
                occurredOn: { type: string, format: date }
                paidOn: { type: string, format: date, nullable: true }
                notes: { type: string, nullable: true }
                expenseType: { $ref: '#/components/schemas/ExpenseTypeResponse' }
                bankAccountId: { type: string, format: uuid, nullable: true }
                creditCardId: { type: string, format: uuid, nullable: true }
                postedOn: { type: string, format: date, nullable: true }
                installment:
                    type: object
                    nullable: true
                    required: [groupId, number, total]
                    properties:
                        groupId: { type: string, format: uuid }
                        number: { type: integer }
                        total: { type: integer }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        StatementStatus:
            type: string
            enum: [OPEN, CLOSED, PAID, ROLLED_OVER]
            description: |
                `OPEN` é o status de toda fatura projetada (não persistida); as demais são
                faturas fechadas. `ROLLED_OVER` é a fechada cujo restante passou para a
                seguinte.

        StatementResponse:
            type: object
            required:
                [
                    id,
                    creditCardId,
                    status,
                    startsOn,
                    closesOn,
                    dueOn,
                    purchasesCents,
                    refundsCents,
                    totalCents,
                    previousBalanceCents,
                    amountDueCents,
                    paidCents,
                    remainingCents,
                    minimumPaymentCents,
                    overdue,
                    closedAt,
                    byExpenseType,
                ]
            description: |
                Todos os valores são derivados dos lançamentos (nada é informado por cliente,
                salvo o mínimo). `expenses`, `refunds` e `payments` só vêm no detalhe
                (`GET /statements/{id}`, `GET /statements/current` e respostas de pagamento),
                não na listagem.
            properties:
                id:
                    type: string
                    format: uuid
                    nullable: true
                    description: Nulo na fatura projetada.
                creditCardId: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/StatementStatus' }
                startsOn: { type: string, format: date }
                closesOn: { type: string, format: date }
                dueOn: { type: string, format: date }
                purchasesCents:
                    type: integer
                    description: Soma das despesas da janela em `OPEN`, `VERIFYING` ou `PAID`.
                refundsCents:
                    type: integer
                    description: Soma dos estornos da janela.
                totalCents:
                    type: integer
                    description: '`purchasesCents − refundsCents`; pode ser negativo.'
                previousBalanceCents:
                    type: integer
                    description: |
                        O que veio da fatura anterior: positivo se ela rolou dívida, negativo se
                        deixou crédito.
                amountDueCents:
                    type: integer
                    description: '`totalCents + previousBalanceCents`.'
                paidCents:
                    type: integer
                    description: Soma dos pagamentos da fatura.
                remainingCents:
                    type: integer
                    description: '`amountDueCents − paidCents`.'
                minimumPaymentCents: { type: integer, nullable: true }
                overdue:
                    type: boolean
                    description: |
                        Verdadeiro na fatura `CLOSED` com `dueOn` passado e `paidCents` menor que
                        o mínimo informado (ou que `amountDueCents`, sem mínimo).
                closedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Quando o fechamento foi registrado; nulo na projetada.
                byExpenseType:
                    type: array
                    description: |
                        `purchasesCents` por tipo de despesa, em ordem de `totalCents`
                        decrescente e depois de `name`.
                    items:
                        type: object
                        required: [expenseTypeId, name, totalCents]
                        properties:
                            expenseTypeId: { type: string, format: uuid }
                            name: { type: string }
                            totalCents: { type: integer }
                expenses:
                    type: array
                    description: Só no detalhe; despesas da janela, em ordem de `postedOn`.
                    items:
                        $ref: '#/components/schemas/StatementExpenseResponse'
                refunds:
                    type: array
                    description: Só no detalhe; estornos da janela, em ordem de `postedOn`.
                    items:
                        $ref: '#/components/schemas/CreditCardRefundResponse'
                payments:
                    type: array
                    description: Só no detalhe.
                    items:
                        $ref: '#/components/schemas/StatementPaymentResponse'

        StatementExpenseResponse:
            type: object
            required:
                [
                    id,
                    description,
                    occurredOn,
                    postedOn,
                    amountCents,
                    status,
                    expenseType,
                    installment,
                ]
            properties:
                id: { type: string, format: uuid }
                description: { type: string }
                occurredOn: { type: string, format: date }
                postedOn: { type: string, format: date }
                amountCents: { type: integer }
                status: { $ref: '#/components/schemas/ExpenseStatus' }
                expenseType:
                    type: object
                    required: [id, name]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                installment:
                    type: object
                    nullable: true
                    required: [groupId, number, total]
                    properties:
                        groupId: { type: string, format: uuid }
                        number: { type: integer }
                        total: { type: integer }

        StatementPaymentResponse:
            type: object
            required: [id, bankAccountId, amountCents, paidOn, createdAt]
            properties:
                id: { type: string, format: uuid }
                bankAccountId: { type: string, format: uuid }
                amountCents: { type: integer }
                paidOn: { type: string, format: date }
                createdAt: { type: string, format: date-time }

        CreateStatementPayment:
            type: object
            additionalProperties: false
            required: [bankAccountId, amountCents]
            properties:
                bankAccountId: { type: string, format: uuid }
                amountCents:
                    type: integer
                    minimum: 1
                    description: Até o `remainingCents` da fatura (409 acima disso).
                paidOn:
                    type: string
                    format: date
                    description: Default hoje; posterior ao `closesOn` e não posterior a hoje.

        CreateEarlyStatementPayment:
            type: object
            additionalProperties: false
            required: [creditCardId, bankAccountId, amountCents]
            properties:
                creditCardId: { type: string, format: uuid }
                bankAccountId: { type: string, format: uuid }
                amountCents:
                    type: integer
                    minimum: 1
                    description: Até o `remainingCents` atual da fatura aberta (409 acima disso).
                paidOn:
                    type: string
                    format: date
                    description: Default hoje; entre o início da fatura aberta e hoje.

        UpdateStatement:
            type: object
            additionalProperties: false
            required: [minimumPaymentCents]
            properties:
                minimumPaymentCents:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: O mínimo informado, sem outra regra; `null` o apaga.

        CreditCardRefundResponse:
            type: object
            required:
                [
                    id,
                    creditCardId,
                    expenseId,
                    description,
                    amountCents,
                    occurredOn,
                    postedOn,
                    notes,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id: { type: string, format: uuid }
                creditCardId: { type: string, format: uuid }
                expenseId: { type: string, format: uuid, nullable: true }
                description: { type: string }
                amountCents: { type: integer }
                occurredOn: { type: string, format: date }
                postedOn: { type: string, format: date }
                notes: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        CreateCreditCardRefund:
            type: object
            additionalProperties: false
            required: [creditCardId, description, amountCents, occurredOn]
            properties:
                creditCardId: { type: string, format: uuid }
                description: { type: string, minLength: 1, maxLength: 200 }
                amountCents: { type: integer, minimum: 1 }
                occurredOn: { type: string, format: date }
                postedOn:
                    type: string
                    format: date
                    description: |
                        Não anterior a `occurredOn`. Default `max(occurredOn, último dia fechado
                        + 1)`; o informado não pode cair na janela fechada.
                expenseId:
                    type: string
                    format: uuid
                    description: A compra estornada; precisa ser despesa do mesmo cartão.
                notes: { type: string, minLength: 1, maxLength: 1000 }

        UpdateCreditCardRefund:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                description: { type: string, minLength: 1, maxLength: 200 }
                notes: { type: string, minLength: 1, maxLength: 1000, nullable: true }

        Error:
            type: object
            required: [error]
            properties:
                error:
                    type: object
                    required: [message]
                    properties:
                        message:
                            type: string
                        code:
                            type: string
                        details: {}
